apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: uptime-monitor-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sirajmoideen/uptime-monitor-gitops.git
    targetRevision: main
    path: helm/uptime-monitor

    helm:
      valueFiles:
        - ../../environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-monitor-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
