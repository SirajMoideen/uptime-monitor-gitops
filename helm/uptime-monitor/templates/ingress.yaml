{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: uptime-monitor

spec:
  ingressClassName: nginx

  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: uptime-monitor
            port:
              number: {{ .Values.service.port }}

{{- end }}